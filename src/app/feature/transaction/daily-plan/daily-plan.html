<div class="card">
    <div class="font-semibold text-xl mb-4">Daily Plan</div>
    <p-table [value]="products" dataKey="id" [tableStyle]="{ 'min-width': '60rem' }" [expandedRowKeys]="expandedRows">
        <ng-template #caption>
            <div class="flex justify-end">
                <button pButton severity="secondary" icon="pi pi-fw {{ isExpanded ? 'pi-chevron-down' : 'pi-chevron-right' }}" label="{{ isExpanded ? 'Collapse All' : 'Expand All' }}" (click)="expandAll()"></button>
                <p-button label="Add" icon="pi pi-plus" styleClass="w-full" class="ml-4"></p-button>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="width: 5rem"></th>
                <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
                <th>Image</th>
                <th pSortableColumn="price">Price <p-sortIcon field="price" /></th>
                <th pSortableColumn="category">Category <p-sortIcon field="category" /></th>
                <th pSortableColumn="rating">Reviews <p-sortIcon field="rating" /></th>
                <th pSortableColumn="inventoryStatus">Status <p-sortIcon field="inventoryStatus" /></th>
            </tr>
        </ng-template>
        <ng-template #body let-product let-expanded="expanded">
            <tr>
                <td>
                    <p-button type="button" pRipple [pRowToggler]="product" [text]="true" [rounded]="true" [plain]="true" [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'" />
                </td>
                <td>{{ product.name }}</td>
                <td>
                    <img [src]="'https://primefaces.org/cdn/primeng/images/demo/product/' + product.image" [alt]="product.name" width="50" class="shadow-lg" />
                </td>
                <td>{{ product.price | currency: 'USD' }}</td>
                <td>{{ product.category }}</td>
                <td>
                    <p-rating [ngModel]="product.rating" [readonly]="true" />
                </td>
                <td>
                    <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product.inventoryStatus)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #expandedrow let-items>
            <tr>
                <td colspan="7">
                    <div class="p-4">
                        <div class="flex justify-between items-center flex-column sm:flex-row">
                            <h5>Orders for {{ items.name }}</h5>
                            <p-iconfield iconPosition="left" class="ml-auto mr-4">
                                <p-inputicon>
                                    <i class="pi pi-search"></i>
                                </p-inputicon>
                                <input pInputText type="text" placeholder="Search keyword" />
                            </p-iconfield>
                            <p-button icon="pi pi-plus" label="Add" styleClass="w-full"></p-button>
                        </div>
                        <div class="grid grid-cols-12 gap-4">
                            <div *ngFor="let item of items.orders; let i = index" class="col-span-12 sm:col-span-6 lg:col-span-2 p-2">
                                <div class="p-6 border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded flex flex-col">
                                    <div class="relative w-full shadow-sm">
                                        <img class="rounded w-full"
                                            src="https://primefaces.org/cdn/primevue/images/product/{{ item.image }}"
                                            [alt]="item.name" />
                                        <div class="absolute bg-black/70 rounded-border" [style]="{
                                                    left: '4px',
                                                    top: '4px'
                                                }">
                                            <p-tag [value]="item.inventoryStatus" [severity]="getSeverity(item)"></p-tag>
                                        </div>
                                    </div>
                                    <div class="pt-12">
                                        <div class="flex flex-row justify-between items-start gap-2">
                                            <div>
                                                <span class="font-medium text-surface-500 dark:text-surface-400 text-sm">{{
                                                    item.category }}</span>
                                                <div class="text-lg font-medium mt-1">
                                                    {{ item.name }}
                                                </div>
                                            </div>
                                            <div class="bg-surface-100 p-1" style="border-radius: 30px">
                                                <div class="bg-surface-0 flex items-center gap-2 justify-center py-1 px-2"
                                                    style="
                                                            border-radius: 30px;
                                                            box-shadow:
                                                                0px 1px 2px 0px rgba(0, 0, 0, 0.04),
                                                                0px 1px 2px 0px rgba(0, 0, 0, 0.06);
                                                        ">
                                                    <span class="text-surface-900 font-medium text-xs">{{ item.rating }}</span>
                                                    <i class="pi pi-star-fill text-yellow-500"></i>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="flex flex-col gap-6 mt-6">
                                            <span class="text-2xl font-semibold">$ {{ item.price }}</span>
                                            <div class="flex gap-2">
                                                <p-button icon="pi pi-shopping-cart" label="Buy Now"
                                                    [disabled]="item.inventoryStatus === 'OUTOFSTOCK'"
                                                    class="flex-auto whitespace-nowrap" styleClass="w-full"></p-button>
                                                <p-button icon="pi pi-heart" styleClass="h-full" [outlined]="true"></p-button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
